[project]
name = "python-dagger-template"
version = "0.1.0"
description = "A template for a Python project using Dagger.io as CI/CD engine."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
ci = [
    "pytest>=8.3.3",
    "pytest-dotenv>=0.5.2",
    "bandit>=1.7.10",
    "pylint>=3.3.1",
    "pylint-secure-coding-standard>=1.5.1",
    "pip-audit>=2.7.3",
]
dev = [
    {include-group = "ci"},
    "dagger-io>=0.21.9",
]

[tool.uv]
package = false
